services:
  build-sdk:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        - UID=${FIXUID:-1001}
    working_dir: /workspace
    environment:
      CANGJIE_VERSION: ${CANGJIE_VERSION:-0.0.1-dev}
      SDK_NAME: ${SDK_NAME:-unofficial}
    volumes:
      - ./:/workspace
    command: bash build_scripts/linux/all.sh
  dev:
    extends: build-sdk
    build:
      target: devcontainer
    command: tail -f /dev/null
    stdin_open: true
    tty: true
